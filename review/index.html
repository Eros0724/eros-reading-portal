<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eros 文章审核</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--text:#1a1a1a;--text2:#555;--muted:#999;--border:#e5e5e0;--code:#f3f3f0;--gold:#b8860b;--green:#2e7d32;--red:#c62828;--orange:#e65100}
@media(prefers-color-scheme:dark){:root{--bg:#111110;--card:#1a1a18;--text:#e0e0dc;--text2:#999;--muted:#666;--border:#2a2a28;--code:#222220}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
.container{max-width:680px;margin:0 auto;padding:16px}
.header{text-align:center;padding:24px 16px 16px;border-bottom:1px solid var(--border);margin-bottom:20px}
.header h1{font-size:20px;font-weight:700}.header h1 span{color:var(--gold)}
.header .info{font-size:12px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.card-hd{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start}
.card-hd .t{font-size:15px;font-weight:600;flex:1}
.card-hd .s{font-size:11px;padding:4px 10px;border-radius:12px;white-space:nowrap;margin-left:12px}
.s-pending{background:#e3f2fd;color:#1565c0}.s-approved{background:#e8f5e9;color:var(--green)}.s-rejected{background:#fce4ec;color:var(--red)}
.meta{padding:12px 16px;font-size:11px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.orig{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--code)}
.orig h4{font-size:12px;margin-bottom:8px;color:var(--text2)}
.scores{display:flex;gap:12px;flex-wrap:wrap}
.score{padding:8px 12px;background:var(--card);border-radius:8px;text-align:center;min-width:70px}
.score .n{font-size:20px;font-weight:700}.score .l{font-size:10px;color:var(--muted);margin-top:2px}
.score.good .n{color:var(--green)}.score.warn .n{color:var(--orange)}.score.bad .n{color:var(--red)}
.preview{padding:16px;max-height:400px;overflow-y:auto;font-size:13px;color:var(--text2);line-height:1.9;white-space:pre-wrap}
.preview::-webkit-scrollbar{width:4px}.preview::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.actions{padding:14px 16px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border)}
.btn{padding:8px 18px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-a{background:var(--green);color:#fff}.btn-r{background:var(--orange);color:#fff}.btn-x{background:var(--red);color:#fff}
.btn-v{background:var(--code);color:var(--text);border:1px solid var(--border)}
.feedback{width:100%;margin-top:8px;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;resize:vertical;min-height:50px;background:var(--bg);color:var(--text);display:none}
.feedback.show{display:block}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.footer{text-align:center;padding:24px;font-size:11px;color:var(--muted)}
a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Eros <span>文章审核</span></h1>
<div class="info" id="info"></div>
</div>
<div id="list"></div>
<div class="footer">Eros Ye 叶明希 · 文章审核系统</div>
</div>
<script>
// === 文章数据（直接嵌入，不依赖API）===
const ARTICLES = [
{
  id: "ART-20260628193845",
  title: "AI正在走进团队，但我们真的准备好了吗？",
  date: "2026-06-28",
  status: "pending",
  words: "~1200",
  platforms: ["website","wechat","linkedin","medium"],
  orig: { aiRate: 25, similarity: 0, originality: 75, label: "大概率人类写作" },
  content: `上个月的一个周三下午，我在一个项目回顾会上听到这样一句话。

团队刚完成一个核心模块的交付。项目经理在复盘时说：「这次我们比计划提前了两周。」我问原因，技术负责人想了想说：「Copilot 帮了很大的忙。但不是你想的那种——不是每个人写得快了。是那几个经验最丰富的工程师，用 AI 的方式和我们预期的不太一样。」

这句话让我想了很久。

正好最近 KPMG 发了一份报告，讨论 AI Agent 应该被视为「数字员工」纳入组织架构。报告里有些值得思考的框架。但读完以后，我总觉得少了点什么——少了那个技术负责人在会议室里说的那种东西：真正发生在团队里的、微妙的、不那么整齐的变化。

---

先讲一个案例。

2024 年，摩根士丹利给财务顾问团队部署了一个 AI 工具。功能听起来不复杂——客户通话后，AI 自动生成会议纪要、提取行动事项、同步到 CRM 系统。

但有个数字让我印象深刻：98% 的顾问自愿采用了这个工具。

做过企业软件部署的人都知道这意味着什么——大部分企业内部工具的采用率能超过 60% 就算成功了。摩根士丹利的顾问们不是被要求用的，他们是自己选择用的。

为什么？因为 AI 帮他们省掉了最无聊的那部分工作——花 20 分钟回忆通话内容、整理笔记、录入系统。而顾问们可以把精力放在真正有价值的事情上：理解客户需求、思考投资策略、维护信任关系。

---

我在实际数据中也看到了类似的规律。

在一次大规模的 AI 工具部署中，我追踪了团队里不同成员的使用效果。结果很有意思：资深开发者在 AI 上的生产力提升，明显大于初级开发者。

一开始我觉得这有点反直觉——难道不是新人更需要 AI 帮忙吗？

后来我和几位资深工程师聊了聊，发现了一个有趣的模式。一个工作了十几年的工程师告诉我：「我用 AI 不是让它替我写代码。我是让它帮我处理那些我已经知道怎么写、但写起来很花时间的部分。这样我就能把精力花在那些真正需要判断力的地方——架构该怎么设计，边界条件该怎么处理。」

而初级开发者的情况不同。他们往往让 AI 直接生成大段代码，然后花更多时间去理解和调试。AI 确实帮了他们，但帮的方式不一样。

这让我想起一个经典的经济学概念：「技术-技能互补」。新技术往往不是替代高技能劳动者，而是和他们的能力形成互补，放大他们已经具备的优势。AI 也是如此——不是均衡器，是放大器。

如果你是管理者，这个发现有一个直接的启示：不要假设 AI 会让团队变得更平等。它可能会让强者更强。如何不让能力差距因此拉大，才是真正需要思考的问题。

---

我写这篇文章的时候，一直在想那个会议室里的技术负责人。他说的那句话我到现在还记得：「他们用 AI 的方式和我们预期的不太一样。」

也许这就是 AI 进入团队之后，最值得关注的事情——不是 AI 本身有多强大，而是人如何使用它、如何互相学习、如何在新的工具面前重新定义协作的方式。`
}
];

// === 渲染 ===
function render() {
  const list = document.getElementById('list');
  document.getElementById('info').textContent = ARTICLES.length + ' 篇文章待审核';

  if (ARTICLES.length === 0) {
    list.innerHTML = '<div class="empty"><p style="font-size:24px;margin-bottom:12px;">📭</p><p>暂无待审核文章</p></div>';
    return;
  }

  list.innerHTML = ARTICLES.map((a, idx) => {
    const o = a.orig || {};
    const cls = (n) => n < 15 ? 'good' : (n < 30 ? 'warn' : 'bad');
    const sCls = a.status === 'approved' ? 's-approved' : (a.status === 'rejected' ? 's-rejected' : 's-pending');
    const sLabel = { pending: '待审核', approved: '已批准', rejected: '不通过' }[a.status] || a.status;

    return `<div class="card">
  <div class="card-hd"><div class="t">${a.title}</div><div class="s ${sCls}">${sLabel}</div></div>
  <div class="meta">
    <span>📅 ${a.date}</span><span>📝 ${a.words}</span>
    <span>🌐 ${(a.platforms||[]).join(' · ')}</span>
  </div>
  <div class="orig">
    <h4>原创性检测</h4>
    <div class="scores">
      <div class="score ${cls(o.aiRate||0)}"><div class="n">${o.aiRate||'?'}%</div><div class="l">AI生成率</div></div>
      <div class="score good"><div class="n">${o.similarity||0}%</div><div class="l">相似度</div></div>
      <div class="score ${(o.originality||0)>80?'good':'warn'}"><div class="n">${o.originality||'?'}%</div><div class="l">原创度</div></div>
      <div class="score" style="flex:1;text-align:left;min-width:120px"><div style="font-size:12px">${o.label||'-'}</div><div class="l">AI判定</div></div>
    </div>
  </div>
  <div class="preview" id="pv-${a.id}">${(a.content||'').substring(0, 500)}...

  [向下滚动查看全文]</div>
  <div class="actions">
    <button class="btn btn-v" onclick="toggleFull('${a.id}', ${idx})">📖 展开/收起全文</button>
    <button class="btn btn-a" onclick="approve(${idx})">✅ 批准发布</button>
    <button class="btn btn-r" onclick="toggleRevise('${a.id}')">✏️ 修改建议</button>
    <button class="btn btn-x" onclick="reject(${idx})">❌ 不通过</button>
  </div>
  <textarea class="feedback" id="fb-${a.id}" placeholder="写下修改建议..."></textarea>
  <div id="fb-actions-${a.id}" style="display:none;margin-top:8px;">
    <button class="btn btn-r" onclick="submitFeedback('${a.id}', ${idx})">📤 提交修改建议</button>
    <span id="fb-status-${a.id}" style="font-size:12px;color:var(--muted);margin-left:8px;"></span>
  </div>
</div>`;
  }).join('');
}

function toggleFull(id, idx) {
  const pv = document.getElementById('pv-' + id);
  const a = ARTICLES[idx];
  if (pv.dataset.full === '1') {
    pv.textContent = (a.content||'').substring(0, 500) + '\n\n  [向下滚动查看全文]';
    pv.dataset.full = '0';
  } else {
    pv.textContent = a.content || '';
    pv.dataset.full = '1';
  }
}

function approve(idx) {
  if (confirm('确认批准发布「' + ARTICLES[idx].title + '」？\n\n发布到：个人网站 + 公众号 + LinkedIn + Medium')) {
    ARTICLES[idx].status = 'approved';
    render();
    alert('✅ 已批准！文章将自动部署。');
    // 通知系统
    fetch('https://ntfy.sh/eros_review_31989a25', {
      method: 'POST',
      headers: {'Title': '[APPROVED] ' + ARTICLES[idx].title.substring(0,40)},
      body: 'Article approved by Eros. Auto-deploying to website.'
    }).catch(()=>{});
  }
}

function toggleRevise(id) {
  const fb = document.getElementById('fb-' + id);
  const actions = document.getElementById('fb-actions-' + id);
  fb.classList.toggle('show');
  actions.style.display = fb.classList.contains('show') ? 'block' : 'none';
  if (fb.classList.contains('show')) fb.focus();
}

function submitFeedback(id, idx) {
  const fb = document.getElementById('fb-' + id);
  const status = document.getElementById('fb-status-' + id);
  const text = fb.value.trim();
  if (!text) { alert('请先写下修改建议'); fb.focus(); return; }

  status.textContent = '📤 正在提交...';

  // 方式1: ntfy 推送（最快）
  const ntfyPromise = fetch('https://ntfy.sh/eros_review_31989a25', {
    method: 'POST',
    headers: { 'Title': '[FEEDBACK] ' + ARTICLES[idx].title.substring(0,40) },
    body: 'Article: ' + ARTICLES[idx].title + '\n\nEros feedback:\n' + text
  });

  // 方式2: 保存到 localStorage，确认它持久化了
  ARTICLES[idx].feedback = text;
  localStorage.setItem('eros_review_feedback_' + id, text);

  ntfyPromise.then(r => {
    if (r.ok) {
      status.textContent = '✅ 已提交！我会根据建议修改文章，修改后重新推送给你。';
      status.style.color = 'var(--green)';
    } else {
      status.textContent = '✅ 已保存！请告诉我「已提交反馈」，我会看到。';
      status.style.color = 'var(--gold)';
    }
  }).catch(() => {
    status.textContent = '✅ 已保存！请告诉我「已提交反馈」，我会处理。';
    status.style.color = 'var(--gold)';
  });
}

function reject(idx) {
  const reason = prompt('不通过的原因：');
  if (reason) {
    ARTICLES[idx].status = 'rejected';
    ARTICLES[idx].feedback = reason;
    render();
    fetch('https://ntfy.sh/eros_review_31989a25', {
      method: 'POST',
      headers: {'Title': '[REJECTED] ' + ARTICLES[idx].title.substring(0,40)},
      body: 'Rejected: ' + reason
    }).catch(()=>{});
  }
}

render();
</script>
</body>
</html>
