<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Eros 阅读门户</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--text:#1a1a1a;--text2:#666;--muted:#999;--gold:#b8860b;--gold-bg:#fef9ef;--border:#e8e4dc;--tag-bg:#f0ece4;--comment-bg:#fffdf7}
@media(prefers-color-scheme:dark){:root{--bg:#111110;--card:#1a1a18;--text:#e0e0dc;--text2:#999;--muted:#666;--border:#2a2a28;--tag-bg:#222220;--comment-bg:#1a1a18;--gold-bg:#2a2410}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding-bottom:60px;-webkit-tap-highlight-color:transparent}
.container{max-width:680px;margin:0 auto;padding:12px}
.header{text-align:center;padding:24px 12px 14px;position:sticky;top:0;background:var(--bg);z-index:100;border-bottom:1px solid var(--border)}
.header h1{font-size:20px;font-weight:700}.header h1 span{color:var(--gold)}
.info{font-size:12px;color:var(--muted);margin-top:4px}
.date-nav{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.date-nav button{padding:5px 10px;border:1px solid var(--border);border-radius:14px;font-size:11px;background:var(--card);color:var(--text2);cursor:pointer}
.date-nav button.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.filter-bar{display:flex;gap:5px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.filter-bar button{padding:4px 8px;border-radius:10px;font-size:10px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer}
.filter-bar button.active{background:var(--text);color:#fff}
.card{background:var(--card);border-radius:10px;margin-bottom:12px;border:1px solid var(--border);overflow:hidden}
.card-hd{padding:14px 14px 8px;cursor:pointer}
.card-hd .n{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--gold-bg);color:var(--gold);font-size:11px;font-weight:700;margin-right:4px;vertical-align:middle}
.card-hd .cat{font-size:10px;padding:2px 6px;border-radius:8px;vertical-align:middle}
.card-hd .title{font-size:14px;font-weight:600;margin-top:6px;line-height:1.5}
.card-hd .src{font-size:11px;color:var(--muted);margin-top:3px}
.card-hd .oneliner{font-size:12px;color:var(--text2);margin-top:5px;line-height:1.5}
.card-hd .whyread{font-size:11px;color:var(--gold);margin-top:3px}
.card-hd .arrow{float:right;font-size:11px;color:var(--muted);margin-top:2px}
.card.open .card-hd .arrow{transform:rotate(180deg)}
.card-detail{display:none;padding:0 14px 12px;font-size:12px;color:var(--text2);line-height:1.8;border-top:1px solid var(--border)}
.card.open .card-detail{display:block}
.card-detail h3{font-size:13px;font-weight:700;color:var(--text);margin:10px 0 4px}
.key-data{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.key-data span{font-size:10px;padding:2px 7px;background:var(--tag-bg);border-radius:8px;color:var(--text2)}
.comment-box{padding:10px 14px;border-top:1px solid var(--border);background:var(--comment-bg)}
.comment-box textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;font-family:inherit;resize:vertical;min-height:44px;background:var(--card);color:var(--text);line-height:1.5}
.comment-box textarea:focus{outline:none;border-color:var(--gold)}
.comment-box button{margin-top:6px;padding:6px 16px;background:var(--gold);color:#fff;border:none;border-radius:14px;font-size:12px;font-weight:600;cursor:pointer}
.comment-box button.saved{background:#4caf50}
.saved-note{font-size:11px;color:var(--text2);padding:6px 10px;background:var(--card);border-radius:6px;margin-top:6px;border-left:3px solid var(--gold)}
.comment-count{font-size:10px;color:var(--gold);margin-left:6px}
.footer{text-align:center;padding:20px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="container">
<div class="header">
  <h1>📖 Eros <span>阅读门户</span></h1>
  <div class="info" id="infoBar"></div>
  <div class="date-nav" id="dateNav"></div>
  <div class="filter-bar" id="filterBar"></div>
</div>
<div id="list"></div>
<div class="footer">Eros Ye 叶明希 · 累计知识库</div>
</div>

<script src="knowledge-base.js"></script>
<script>
const CATS=['all','🏭 工业界洞察','🏢 大公司实践','🎓 学术研究','👥 人才与团队','🔀 跨界AI治理','🧠 行为与心理'];
const CAT_COLORS={
  '🧠 行为与心理':'background:#f3effc;color:#7c5cbf',
  '🏭 工业界洞察':'background:#e8f2fc;color:#2d7dd2',
  '🏢 大公司实践':'background:#fdeee9;color:#e85d3a',
  '🔀 跨界AI治理':'background:#e4f5ef;color:#1a9c7a',
  '🎓 学术研究':'background:#fef8ed;color:#d4a853',
  '👥 人才与团队':'background:#fce4ec;color:#c62828'
};

let filter='all';
let selectedDate='all';

// 获取所有日期
function getDates(){
  const dates=new Set();
  (ALL_ARTICLES||[]).forEach(a=>{if(a.date_added)dates.add(a.date_added)});
  return Array.from(dates).sort().reverse();
}

// 获取评论
function getComment(uid){
  if(ALL_COMMENTS&&ALL_COMMENTS[uid])return ALL_COMMENTS[uid];
  // 也查 localStorage
  try{
    const c=JSON.parse(localStorage.getItem('eros_comments')||'{}');
    return c[uid]||'';
  }catch(e){return'';}
}

function saveComment(uid,text){
  try{
    const c=JSON.parse(localStorage.getItem('eros_comments')||'{}');
    c[uid]=text;
    localStorage.setItem('eros_comments',JSON.stringify(c));
  }catch(e){}
}

function render(){
  let articles=ALL_ARTICLES||[];
  if(selectedDate!=='all') articles=articles.filter(a=>a.date_added===selectedDate);
  if(filter!=='all') articles=articles.filter(a=>a.category===filter);

  const dates=getDates();
  const totalAll=(ALL_ARTICLES||[]).length;
  
  // 统计已评论
  let commented=0;
  articles.forEach(a=>{if(getComment(a.uid||''))commented++});

  document.getElementById('infoBar').innerHTML=
    `<b>${totalAll}</b> 篇累计 · 当前显示 <b>${articles.length}</b> 篇 · <b>${commented}</b> 条观点`;

  document.getElementById('dateNav').innerHTML=
    `<button class="${selectedDate==='all'?'active':''}" onclick="setDate('all')">全部日期</button>`+
    dates.slice(0,10).map(d=>`<button class="${selectedDate===d?'active':''}" onclick="setDate('${d}')">${d.slice(5)}</button>`).join('');

  document.getElementById('filterBar').innerHTML=CATS.map(c=>
    `<button class="${filter===c?'active':''}" onclick="setFilter('${c}')">${c==='all'?'全部':c.replace(/🏭|🏢|🎓|👥|🔀|🧠 /g,'')}</button>`
  ).join('');

  document.getElementById('list').innerHTML=articles.length===0
    ?'<div style="text-align:center;padding:60px;color:var(--muted)">📭 暂无文章</div>'
    :articles.map(a=>{
      const uid=a.uid||'';
      const c=getComment(uid);
      const detail=formatDetail(a.full_content||'');
      const kd=(a.key_data||[]).map(d=>`<span>${d}</span>`).join('');
      return `<div class="card" id="card-${uid}">
  <div class="card-hd" onclick="toggle('${uid}')">
    <span class="arrow">▼</span>
    <span class="n">${a.num}</span>
    <span class="cat" style="${CAT_COLORS[a.category]||''}">${a.category}</span>
    <span class="comment-count">${c?'💬':''}</span>
    <div class="title">${a.title}</div>
    <div class="src">📎 ${a.source||''} · ${a.date_added||''}</div>
    <div class="oneliner">🎯 ${a.one_liner||''}</div>
    <div class="whyread">💡 ${a.why_read||''}</div>
    <div class="key-data">${kd}</div>
  </div>
  <div class="card-detail" id="detail-${uid}">${detail}</div>
  <div class="comment-box">
    <textarea id="input-${uid}" placeholder="💬 写下你的评价...">${c}</textarea>
    <button id="btn-${uid}" class="${c?'saved':''}" onclick="saveAndUpdate('${uid}')">${c?'✓ 已保存':'保存观点'}</button>
    ${c?`<div class="saved-note">💭 ${c}</div>`:''}
  </div>
</div>`}).join('');
}

function formatDetail(text){
  if(!text)return'<p style="color:var(--muted)">暂无详细内容</p>';
  let h='';
  for(let line of text.split('\n')){
    let t=line.trim();
    if(!t){h+='<br>';continue}
    if(t.startsWith('## '))h+=`<h3>${esc(t.slice(3))}</h3>`;
    else if(t.startsWith('### '))h+=`<h4 style="font-weight:600;color:var(--text);margin-top:8px">${esc(t.slice(4))}</h4>`;
    else if(t.startsWith('- '))h+=`<div style="padding-left:6px">· ${esc(t.slice(2))}</div>`;
    else h+=`<div>${esc(t)}</div>`;
  }
  return h;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}

function toggle(uid){
  document.getElementById('card-'+uid).classList.toggle('open');
}
function setDate(d){selectedDate=d;render()}
function setFilter(f){filter=f;render()}
function saveAndUpdate(uid){
  const v=document.getElementById('input-'+uid).value.trim();
  if(v){
    saveComment(uid,v);
    // 发送到服务器
    fetch('https://eros0724.github.io/eros-reading-portal/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid,comment:v,date:new Date().toISOString().slice(0,10)})}).catch(()=>{});
    render();
  }
}

render();
</script>
</body>
</html>
