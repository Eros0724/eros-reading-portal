<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Eros 阅读门户</title>
<style>
  :root {
    --bg: #f5f3ef; --card: #ffffff; --text: #1a1a1a; --text-secondary: #666;
    --text-muted: #999; --gold: #b8860b; --gold-light: #fef9ef; --border: #e8e4dc;
    --tag-bg: #f0ece4; --comment-bg: #fffdf7;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    background: var(--bg); color: var(--text); line-height:1.7; padding-bottom:60px;
    -webkit-tap-highlight-color: transparent;
  }
  .container { max-width:680px; margin:0 auto; padding:12px; }

  .header {
    text-align:center; padding:24px 12px 14px; position:sticky; top:0;
    background: var(--bg); z-index:100; border-bottom:1px solid var(--border);
  }
  .header h1 { font-size:20px; font-weight:700; }
  .header h1 span { color:var(--gold); }
  .header .info { font-size:12px; color:var(--text-muted); margin-top:4px; }

  .filter-bar { display:flex; gap:5px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
  .filter-bar button {
    padding:5px 10px; border-radius:12px; font-size:11px; border:1px solid var(--border);
    background:var(--card); color:var(--text-secondary); cursor:pointer;
  }
  .filter-bar button.active { background:var(--text); color:white; border-color:var(--text); }

  .article-card {
    background:var(--card); border-radius:10px; margin-bottom:12px;
    border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,0.03);
  }
  .card-summary { padding:14px 14px 8px; cursor:pointer; }
  .card-summary .num {
    display:inline-block; width:22px; height:22px; line-height:22px; text-align:center;
    border-radius:50%; background:var(--gold-light); color:var(--gold);
    font-size:11px; font-weight:700; margin-right:4px; vertical-align:middle;
  }
  .card-summary .cat {
    font-size:10px; padding:2px 7px; border-radius:8px; vertical-align:middle;
  }
  .card-summary .title {
    font-size:14px; font-weight:600; margin-top:6px; line-height:1.5;
    display:flex; align-items:flex-start; gap:4px;
  }
  .card-summary .source { font-size:11px; color:var(--text-muted); margin-top:3px; }
  .card-summary .oneliner { font-size:12px; color:var(--text-secondary); margin-top:5px; line-height:1.5; }
  .card-summary .whyread { font-size:11px; color:var(--gold); margin-top:3px; }
  .card-summary .arrow { float:right; font-size:11px; color:var(--text-muted); margin-top:2px; transition:transform 0.2s; }
  .article-card.open .card-summary .arrow { transform:rotate(180deg); }

  .card-detail {
    display:none; padding:0 14px 12px; font-size:12px; color:var(--text-secondary);
    line-height:1.8; border-top:1px solid var(--border);
  }
  .article-card.open .card-detail { display:block; }
  .card-detail h3 { font-size:13px; font-weight:700; color:var(--text); margin:10px 0 4px; }
  .card-detail h4 { font-size:12px; font-weight:600; color:var(--text); margin:8px 0 2px; }
  .card-detail strong { color:var(--text); }

  .key-data { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .key-data span { font-size:10px; padding:2px 7px; background:var(--tag-bg); border-radius:8px; color:var(--text-secondary); }

  .comment-box { padding:10px 14px; border-top:1px solid var(--border); background:var(--comment-bg); }
  .comment-box textarea {
    width:100%; border:1px solid var(--border); border-radius:6px; padding:8px 10px;
    font-size:12px; font-family:inherit; resize:vertical; min-height:44px;
    background:white; line-height:1.5;
  }
  .comment-box textarea:focus { outline:none; border-color:var(--gold); }
  .comment-box button {
    margin-top:6px; padding:6px 16px; background:var(--gold); color:white;
    border:none; border-radius:14px; font-size:12px; font-weight:600; cursor:pointer;
  }
  .comment-box button.saved { background:#4caf50; }
  .saved-note { font-size:11px; color:var(--text-secondary); padding:6px 10px; background:white; border-radius:6px; margin-top:6px; border-left:3px solid var(--gold); }

  .footer { text-align:center; padding:20px; font-size:11px; color:var(--text-muted); }

  @media (max-width:480px) {
    .container { padding:8px; }
    .header { padding:18px 8px 10px; }
    .header h1 { font-size:18px; }
    .card-summary { padding:12px 12px 6px; }
    .card-summary .title { font-size:13px; }
    .card-detail { padding:0 12px 10px; }
    .comment-box { padding:8px 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📖 Eros <span>阅读门户</span></h1>
    <div class="info" id="infoBar"></div>
    <div class="filter-bar" id="filterBar"></div>
  </div>
  <div id="articleList"></div>
  <div class="footer">Eros Ye 叶明希 · 每日精选推送</div>
</div>

<script src="articles.js"></script>
<script>
const CATS = [
  {key:'all',label:'全部'},
  {key:'🧠 行为与心理',label:'🧠 心理'},
  {key:'🏭 工业界洞察',label:'🏭 工业界'},
  {key:'🏢 大公司实践',label:'🏢 大公司'},
  {key:'🔀 跨界AI治理',label:'🔀 跨界'},
  {key:'🎓 学术研究',label:'🎓 学术'}
];
const CAT_COLORS = {
  '🧠 行为与心理':'background:#f3effc;color:#7c5cbf',
  '🏭 工业界洞察':'background:#e8f2fc;color:#2d7dd2',
  '🏢 大公司实践':'background:#fdeee9;color:#e85d3a',
  '🔀 跨界AI治理':'background:#e4f5ef;color:#1a9c7a',
  '🎓 学术研究':'background:#fef8ed;color:#d4a853'
};

let filter = 'all';
let comments = JSON.parse(localStorage.getItem('eros_comments') || '{}');

function render() {
  let arts = ARTICLES.filter(a => filter==='all' || a.category===filter);
  
  document.getElementById('infoBar').textContent = 
    `2026年6月28日 · ${arts.length} 篇文章 · ${Object.values(comments).filter(c=>c).length} 条观点`;

  document.getElementById('filterBar').innerHTML = CATS.map(c =>
    `<button class="${filter===c.key?'active':''}" onclick="setFilter('${c.key}')">${c.label}</button>`
  ).join('');

  document.getElementById('articleList').innerHTML = arts.map(a => {
    let num = a.num;
    let c = comments[num] || '';
    let detail = formatDetail(a.full_content || '');
    let kd = (a.key_data||[]).map(d=>`<span>${d}</span>`).join('');

    return `<div class="article-card" id="card-${num}">
  <div class="card-summary" onclick="toggleCard(${num})">
    <span class="arrow" id="arrow-${num}">▼</span>
    <span class="num">${num}</span>
    <span class="cat" style="${CAT_COLORS[a.category]||''}">${a.category}</span>
    <div class="title">${a.title}</div>
    <div class="source">📎 ${a.source||''}</div>
    <div class="oneliner">🎯 ${a.one_liner||''}</div>
    <div class="whyread">💡 ${a.why_read||''}</div>
    <div class="key-data">${kd}</div>
  </div>
  <div class="card-detail" id="detail-${num}">${detail}</div>
  <div class="comment-box">
    <textarea id="input-${num}" placeholder="💬 写下你的评价..." oninput="autoSave(${num})">${c}</textarea>
    <button id="btn-${num}" class="${c?'saved':''}" onclick="saveComment(${num})">${c?'✓ 已保存':'保存观点'}</button>
    ${c?`<div class="saved-note">💭 ${c}</div>`:''}
  </div>
</div>`;
  }).join('');
}

function formatDetail(text) {
  if(!text) return '<p style="color:#999;">暂无详细内容</p>';
  let h='';
  for(let line of text.split('\n')){
    let t=line.trim();
    if(!t){h+='<br>';continue;}
    if(t.startsWith('## ')) h+=`<h3>${esc(t.slice(3))}</h3>`;
    else if(t.startsWith('### ')) h+=`<h4>${esc(t.slice(4))}</h4>`;
    else if(t.startsWith('- ')) h+=`<div style="padding-left:6px;">· ${esc(t.slice(2))}</div>`;
    else h+=`<div>${esc(t)}</div>`;
  }
  return h;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

function toggleCard(num) {
  document.getElementById('card-'+num).classList.toggle('open');
}

function setFilter(f) { filter=f; render(); }

function autoSave(num) {
  let v = document.getElementById('input-'+num).value.trim();
  if(v) { comments[num]=v; localStorage.setItem('eros_comments',JSON.stringify(comments)); }
}

function saveComment(num) {
  let v = document.getElementById('input-'+num).value.trim();
  if(v) {
    comments[num]=v;
    localStorage.setItem('eros_comments',JSON.stringify(comments));
  }
  render();
}

render();
</script>
</body>
</html>
